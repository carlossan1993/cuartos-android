name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python3 scripts/check_docs.py
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:bundles
      - run: npm run play:check
      # ubuntu-latest already supplies Chromium's shared libraries. Install
      # only the headless browser used by these tests, without an apt upgrade.
      - run: npx playwright install --only-shell chromium
      - run: npm run test:e2e
      - run: npm run test:qa
      - name: Capture Play listing assets from actual UI
        run: |
          npm run play:assets
          python3 scripts/normalize-play-images.py
          node scripts/play-preview.mjs
          cp -R play/listing play-output/listing
          cp -R public/privacy play-output/privacy
      - uses: actions/upload-artifact@v6
        with:
          name: cuartos-play-listing
          path: play-output/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: web-evidence
          path: test-results/
          retention-days: 3

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run android:sync
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Ensure Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Lint, unit task and debug APK
        working-directory: android
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug lintRelease testReleaseUnitTest bundleRelease
      - name: Inspect unsigned release bundle and merged manifest
        run: python3 scripts/check-aab.py
      - uses: actions/upload-artifact@v6
        with:
          name: cuartos-release-unsigned
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            play-output/release/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v6
        with:
          name: cuartos-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 3

  android-smoke:
    runs-on: ubuntu-latest
    needs: android
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: cuartos-debug
          path: test-results/apk
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Allow runner access to KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Native WebView smoke on disposable API 35 AVD
        shell: bash
        run: |
          mkdir -p test-results/android-smoke
          bash scripts/run-android-smoke.sh 2>&1 | tee test-results/android-smoke/setup.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-smoke-evidence
          path: test-results/android-smoke/
          retention-days: 3
