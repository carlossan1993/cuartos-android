name: Foundation

on:
  pull_request:
  push:
    branches: [main, chore/repository-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate repository foundation
        run: python3 scripts/check_docs.py
